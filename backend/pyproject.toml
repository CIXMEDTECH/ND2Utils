[project]
name = "nd2utils"
version = "0.1.0"
description = "Self-hosted ND2 preview, metadata, and export tool"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "nd2[tiff]>=0.10",
  "lxml>=5.3",
  "numpy>=2.0",
  "pillow>=11.0",
  "tifffile>=2024.8",
  "imagecodecs>=2024.1",
  "liffile>=2026.7.14",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nd2utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
